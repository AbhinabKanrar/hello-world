# Source: Pew ATP wave 132 methodology, pp. 1-2; July 31-August 6, 2023.
# Eligibility-only baseline; no invented demographic proportions or joint profiles.
# All personas share these attributes; generation seeds are not demographic diversity.
audience: >-
  Noninstitutionalized adults aged 18 and older living in the United States,
  including Alaska and Hawaii, in late July and early August 2023.
size: 200
diversity: high
non_buyer_share: 0.0
attributes:
  country_of_residence:
    kind: categorical
    options: ["United States"]
    pick: 1
  age_eligibility:
    kind: categorical
    options: ["18 years or older"]
    pick: 1