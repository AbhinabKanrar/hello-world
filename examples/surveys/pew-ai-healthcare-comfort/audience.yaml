# Source: Pew ATP wave 119 methodology; human fieldwork December 12-18, 2022.
# Eligibility-only baseline: no verified demographic marginals or joint profiles.
# All personas share these attributes; variation comes from model generation, not demographics.
audience: >-
  Non-institutionalized adults aged 18 and older living in the United States,
  including Alaska and Hawaii, in December 2022.
size: 200
diversity: high
non_buyer_share: 0.0
attributes:
  country_of_residence:
    kind: categorical
    options: ["United States"]
    pick: 1
  age_eligibility:
    kind: categorical
    options: ["18 years or older"]
    pick: 1