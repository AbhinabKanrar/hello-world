# Eligibility: Pew ATP wave 119; population approximation: Census Vintage 2022.
# Counts: nc-est2022-agesex-res.csv, POPESTIMATE2022, SEX 1/2, adult ages only.
# Joint age/sex categories preserve this relationship without changing the sampler.
# Resident population estimates are not Pew's noninstitutionalized panel weights.
audience: >-
  Non-institutionalized adults aged 18 and older living in the United States,
  including Alaska and Hawaii, in December 2022.
size: 200
diversity: high
non_buyer_share: 0.0
attributes:
  country_of_residence:
    kind: categorical
    options: ["United States"]
    pick: 1
  age_and_sex:
    kind: categorical
    options:
      - "Male; age 18 to 29"
      - "Male; age 30 to 49"
      - "Male; age 50 to 64"
      - "Male; age 65 or older"
      - "Female; age 18 to 29"
      - "Female; age 30 to 49"
      - "Female; age 50 to 64"
      - "Female; age 65 or older"
    weights:
      - 27371398
      - 43801998
      - 31106544
      - 25929344
      - 26149897
      - 42825601
      - 31786440
      - 31865508
    pick: 1