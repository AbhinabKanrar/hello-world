# Source: Special Eurobarometer 574 report, QB1R, pp. 11 and 14.
# Report-category approximation; original interview options/recoding remain unverified.

schema_version: trial-v1

name: "QB1R sport frequency - April-May 2026 (report-category approximation)"

# Reported overall start date; TS2 lists earlier starts for Italy and Sweden.
as_of: "2026-04-09"

stimulus: >-
  By "exercise" we mean any form of physical activity which you do in a sport
  context or sport-related setting, such as swimming, training in a fitness
  centre or a sport club, brisk walking or running (e.g. in the park).

question: >-
  How often do you exercise or play sport?

options:
  - id: almost_daily
    label: "Almost daily"
    group: "At least several times a week"
    nonresponse: false

  - id: several_times_a_week
    label: "Several times a week"
    group: "At least several times a week"
    nonresponse: false

  - id: seldom
    label: "Seldom"
    group: "Seldom / Never"
    nonresponse: false

  - id: never
    label: "Never"
    group: "Seldom / Never"
    nonresponse: false

  # Displayed explicitly here; original nonresponse administration remains unverified.
  - id: nonresponse
    label: "Don't know"
    group: null
    nonresponse: true
