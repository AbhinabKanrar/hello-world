# Source: Special Eurobarometer 574 report, methodology p. 6 and TS1-TS2.
# Reported fieldwork: 9 April-4 May 2026; human sample: 26,508.
# Independent-marginal approximation, not the original sample or survey weighting.
# Only country weights below are verified from the supplied report.

audience: >-
  People aged 15 and over who are nationals of an EU Member State and
  reside in one of the 27 EU Member States, in April-May 2026.
  In Cyprus, coverage is limited to the area controlled by the government
  of the Republic of Cyprus.

size: 200

# Required/available settings in the existing audience schema.
diversity: high
non_buyer_share: 0.0

attributes:
  country_of_residence:
    kind: categorical
    # TS2 population aged 15+ totals, not interview counts; normalized by the sampler.
    options:
      - "Belgium"
      - "Bulgaria"
      - "Czechia"
      - "Denmark"
      - "Germany"
      - "Estonia"
      - "Ireland"
      - "Greece"
      - "Spain"
      - "France"
      - "Croatia"
      - "Italy"
      - "Republic of Cyprus (government-controlled area)"
      - "Latvia"
      - "Lithuania"
      - "Luxembourg"
      - "Hungary"
      - "Malta"
      - "Netherlands"
      - "Austria"
      - "Poland"
      - "Portugal"
      - "Romania"
      - "Slovenia"
      - "Slovakia"
      - "Finland"
      - "Sweden"
    weights:
      - 9892796
      - 5534456
      - 9172797
      - 5022981
      - 71818299
      - 1154359
      - 4338938
      - 9041201
      - 42189318
      - 56855864
      - 3319752
      - 51784963
      - 818909
      - 1579066
      - 2467008
      - 566303
      - 8199448
      - 493961
      - 15228902
      - 7842929
      - 31082980
      - 9275958
      - 16034437
      - 1811104
      - 4557290
      - 4771619
      - 8748126
    pick: 1

  # Remaining weights are retained user assumptions, not verified survey marginals.
  # They are independent of country and each other; joint profiles may be implausible.
  age_group:
    kind: categorical
    options:
      - "15 to 24"
      - "25 to 39"
      - "40 to 54"
      - "55+"
    weights: [14.0, 23.0, 26.0, 37.0]
    pick: 1

  gender:
    kind: categorical
    options:
      - "Male"
      - "Female"
    weights: [48.0, 52.0]
    pick: 1

  community_type:
    kind: categorical
    options:
      - "Rural area or village"
      - "Small or middle sized town"
      - "Large town"
    weights: [33.0, 39.0, 28.0]
    pick: 1

  education:
    kind: categorical
    options:
      - "Finished at 15 years or younger"
      - "Finished at 16 to 19 years"
      - "Finished at 20 years or older"
      - "Still studying"
    weights: [15.0, 42.0, 33.0, 10.0]
    pick: 1
