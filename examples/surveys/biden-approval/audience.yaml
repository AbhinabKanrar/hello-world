# Source: user-supplied biden-approval-survey.md,
# Public Use File Codebook, pages 43–50.
#
# Study fieldwork: February 16–20, 2023.
# Original completed sample: 1,247 adults; synthetic run size below: 200.
#
# This is an independent-marginal synthetic approximation.
# It does not reconstruct original respondents or FINALWT.
# Sampling weights below are published Weighted Percent values.
# Small rounding discrepancies are normalized by the sampler.
#
# No approval results are included in the respondent inputs.

audience: >-
  Adults aged 18 and over in the United States household population,
  across the 50 states and the District of Columbia, in February 2023.

size: 200

# Required/available settings in the existing audience schema.
# Generated traits are not used by the attributes-only survey prompt.
diversity: high
non_buyer_share: 0.0

attributes:
  age_group:
    kind: categorical
    # Preserve AGEGRP labels from the codebook.
    # These are categories, not numeric ranges.
    options:
      - "18 to 29"
      - "30 to 39"
      - "40 to 59"
      - "60 to 65"
      - "65+"
    weights: [19.87, 17.56, 32.25, 8.30, 22.01]
    pick: 1

  gender:
    kind: categorical
    # Published categories; no additional categories are inferred.
    options:
      - "Male"
      - "Female"
    weights: [48.79, 51.21]
    pick: 1

  race_ethnicity:
    kind: categorical
    options:
      - "White"
      - "Black or African American"
      - "Hispanic"
      - "Other"
    weights: [62.06, 12.03, 17.17, 8.74]
    pick: 1

  education:
    kind: categorical
    # Use the codebook's four-category EDUCATION variable,
    # not the topline's differently grouped education table.
    options:
      - "Less than a high school diploma"
      - "High school graduate or equivalent"
      - "Some college"
      - "College graduate or above"
    weights: [9.56, 29.20, 26.44, 34.81]
    pick: 1

  census_region:
    kind: categorical
    # Do not independently sample state as well:
    # the current sampler cannot enforce state-region consistency.
    options:
      - "Northeast"
      - "Midwest"
      - "South"
      - "West"
    weights: [17.41, 20.61, 38.28, 23.69]
    pick: 1

  community_type:
    kind: categorical
    options:
      - "Urban"
      - "Suburban"
      - "Rural"
      - "Community type not recorded"
    weights: [25.26, 48.24, 25.68, 0.82]
    pick: 1
    # Last category represents code 99, not a fourth community type.

  marital_status:
    kind: categorical
    options:
      - "Married"
      - "Widowed"
      - "Divorced"
      - "Separated"
      - "Never married"
    weights: [48.94, 3.25, 9.70, 5.51, 32.60]
    pick: 1

  employment_status:
    kind: categorical
    options:
      - "Working - as a paid employee"
      - "Working - self-employed"
      - "Not working - on temporary layoff from a job"
      - "Not working - looking for work"
      - "Not working - retired"
      - "Not working - disabled"
      - "Not working - other"
    weights: [50.93, 7.07, 2.05, 4.99, 19.97, 6.95, 8.05]
    pick: 1

  household_income:
    kind: categorical
    options:
      - "Under $10,000"
      - "$10,000 to under $20,000"
      - "$20,000 to under $30,000"
      - "$30,000 to under $40,000"
      - "$40,000 to under $50,000"
      - "$50,000 to under $75,000"
      - "$75,000 to under $100,000"
      - "$100,000 to under $150,000"
      - "$150,000 or more"
    weights: [7.10, 7.94, 10.12, 8.13, 8.33, 17.55, 14.08, 16.22, 10.52]
    pick: 1

  housing:
    kind: categorical
    options:
      - "Owned or being bought by you or someone in your household"
      - "Rented for cash"
      - "Occupied without payment of cash rent"
    weights: [67.63, 30.41, 1.96]
    pick: 1

  party_identification:
    kind: categorical
    # POLITICS: direct party identification.
    # These are NOT the Democrat/Republican NET categories including leaners.
    options:
      - "Democrat"
      - "Republican"
      - "Independent"
      - "None of these"
      - "Party identification not recorded"
    weights: [33.97, 25.81, 25.40, 13.89, 0.93]
    pick: 1

  political_ideology:
    kind: categorical
    options:
      - "Very liberal"
      - "Somewhat liberal"
      - "Moderate"
      - "Somewhat conservative"
      - "Very conservative"
      - "Political ideology not recorded"
    weights: [11.61, 12.30, 48.30, 16.06, 10.36, 1.36]
    pick: 1

  religion:
    kind: categorical
    options:
      - "Protestant (Baptist, Methodist, Non-denominational, Lutheran, Presbyterian, Pentecostal, Episcopalian, Reformed, Church of Christ, Jehovah's Witness, etc.)"
      - "Roman Catholic (Catholic)"
      - "Mormon (Church of Jesus Christ of Latter-day Saints/LDS)"
      - "Orthodox (Greek, Russian, or some other orthodox church)"
      - "Jewish (Judaism)"
      - "Muslim (Islam)"
      - "Buddhist"
      - "Hindu"
      - "Atheist (do not believe in God)"
      - "Agnostic (not sure if there is a God)"
      - "Nothing in particular"
      - "Just Christian"
      - "Unitarian (Universalist)"
      - "Something else"
    weights:
      - 25.85
      - 18.28
      - 1.64
      - 0.40
      - 0.97
      - 0.42
      - 1.26
      - 1.44
      - 6.61
      - 5.96
      - 16.73
      - 17.96
      - 0.75
      - 1.75
    pick: 1
