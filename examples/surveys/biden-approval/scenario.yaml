# Provisional instrument: verify wording and options against the original questionnaire.

schema_version: trial-v1

name: "Joe Biden overall job approval - February 2023 (approximation)"

# Start-of-fieldwork convention for the February 16-20, 2023 study.
as_of: "2023-02-16"

stimulus: >-
  Consider Joe Biden's overall performance as president of the United States
  as of February 16, 2023.

question: >-
  Do you approve or disapprove of the way Joe Biden is handling his job
  as president?

options:
  - id: approve
    label: "Approve"
    group: "Approve"
    nonresponse: false

  - id: disapprove
    label: "Disapprove"
    group: "Disapprove"
    nonresponse: false

  # Displayed nonresponse is an approximation, not a verified original option.
  - id: nonresponse
    label: "Don't know / prefer not to answer"
    group: null
    nonresponse: true
